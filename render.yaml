# Render Blueprint. Secrets are NOT stored here: sync:false means Render asks you
# to type each value in the dashboard (they live only in Render Environment Variables).
services:
  - type: web
    name: finix-ai
    runtime: python
    plan: free
    # Backend only for now. When the React frontend is added, the build becomes:
    #   pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --worker-class gthread --workers 1 --threads 8 --timeout 300 --max-requests 200 --max-requests-jitter 20
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TAVILY_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ADMIN_1_USERNAME
        sync: false
      - key: ADMIN_1_PASSWORD
        sync: false
      - key: ADMIN_2_USERNAME
        sync: false
      - key: ADMIN_2_PASSWORD
        sync: false
